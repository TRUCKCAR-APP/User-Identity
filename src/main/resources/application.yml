server:
  port: ${PORT:8080}

spring:
  application:
    name: user-identity

  datasource:
    # Fuera de Docker (IDE/tests) la conexión es directa y el esquema va en currentSchema. En Docker se pasa por
    # PgBouncer (SPRING_DATASOURCE_URL) y el search_path lo fija el rol user_identity.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:truckcar_db}?currentSchema=user_identity,public
    username: ${DB_USER:truckcar_admin}
    # Sin valor por defecto: fuera de Docker se define DB_PASSWORD (en el CI, el de su PostgreSQL efímero).
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: user-identity-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration); Hibernate solo comprueba que coincida con las entidades.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Esquema propio del servicio (rol y esquema creados por db-init); el historial de Flyway vive en él y Flyway
    # usa la misma conexión que la aplicación.
    schemas: user_identity
    default-schema: user_identity
    # Bases anteriores a Flyway en el esquema (tablas movidas desde public): línea base 0 para que V1 y V2
    # (idempotentes) se apliquen.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  jwt:
    # Secreto JWT compartido con api-gateway y Notifications (Base64, >= 256 bits). Sin valor por defecto.
    secret: ${TRUCKCAR_JWT_SECRET:${JWT_SECRET:}}
    # Access token de 15 min (el frontend lo renueva con el refresh token); refresh token de 7 días, de un solo uso.
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
  # ADMIN inicial creado por AdminBootstrap si aún no existe. Sin valores no se crea ninguno.
  admin:
    email: ${TRUCKCAR_ADMIN_EMAIL:}
    password: ${TRUCKCAR_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

truckcar:
  kafka:
    topic:
      user-events: ${TRUCKCAR_USER_EVENTS_TOPIC:truckcar.events.user-events}

# ── Observabilidad ──────────────────────────────────────────────────────────────────────────────
# /actuator/prometheus solo es accesible dentro de la red interna: el api-gateway no enruta /actuator/**.
# Las trazas se exportan por OTLP al otel-collector cuando se define MANAGEMENT_OTLP_TRACING_ENDPOINT (en Docker,
# http://otel-collector:4318/v1/traces); sin ella no se exporta nada.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRUCKCAR_TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      # X-Correlation-Id (lo genera el api-gateway) viaja como cabecera propia en HTTP y en Kafka y se copia al MDC.
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id

logging:
  # [servicio,traceId,spanId] en cada línea de log y, en las peticiones que lo traen, el X-Correlation-Id.
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] [cid=%X{X-Correlation-Id:-}] "
