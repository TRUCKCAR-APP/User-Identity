server:
  port: ${PORT:8080}

spring:
  application:
    name: user-identity

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:truckcar_db}
    username: ${DB_USER:truckcar_admin}
    password: ${DB_PASSWORD:truckcar_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: user-identity-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Historial propio: truckcar_db es compartida y Notifications también usa Flyway; con la tabla por defecto
    # las versiones de ambos servicios se mezclarían (una V2 de uno daría por aplicada la V2 del otro).
    table: flyway_schema_history_user_identity
    locations: classpath:db/migration
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:truckcar_db}
    user: ${DB_USER:truckcar_admin}
    password: ${DB_PASSWORD:truckcar_password}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  jwt:
    # Secreto JWT compartido con api-gateway y Notifications (Base64, >= 256 bits). Sin valor por defecto.
    secret: ${TRUCKCAR_JWT_SECRET:${JWT_SECRET:}}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

truckcar:
  kafka:
    topic:
      user-events: ${TRUCKCAR_USER_EVENTS_TOPIC:truckcar.events.user-events}
